    <!-- 🔴 ส่วนของ LINE LIFF ที่เราเพิ่มเข้ามา 🔴 -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        window.myLiffLogin = async function() {
            try {
                await liff.init({
                    liffId: "2010896662-9IK1fj4R"
                });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return "NOT_LOGGED_IN";
                }
                const profile = await liff.getProfile();
                return profile.displayName;
            } catch (err) {
                console.error("LIFF Init Error: ", err);
                return "ERROR";
            }
        }
    </script>
    <!-- 🔴 จบส่วนของ LINE LIFF 🔴 -->
